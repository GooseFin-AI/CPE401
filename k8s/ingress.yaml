apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-frontend-ingress
  namespace: development
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: dev.yourdomain.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dev-frontend-service
                port:
                  number: 80