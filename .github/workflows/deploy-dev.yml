name: Deploy Dev to CloudStack K8s

on:
  push:
    branches: [frontend]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name for Docker tag
        id: repo_name
        run: echo "IMAGE_TAG=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):dev" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}

      - name: Deploy to CloudStack Kubernetes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUDSTACK_VM_IP }}
          username: ${{ secrets.CLOUDSTACK_VM_USER }}
          key: ${{ secrets.CLOUDSTACK_SSH_KEY }}
          script: |
            export KUBECONFIG=~/.kube/config
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/dev/k8s/deployment.yaml
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/dev/k8s/service.yaml
            kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/dev/k8s/ingress.yaml
            kubectl rollout restart deployment/dev-frontend -n development