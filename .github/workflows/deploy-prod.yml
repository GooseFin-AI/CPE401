name: Deploy Main to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Remove stale Vercel metadata
        run: rm -rf .vercel

      - name: Pull Vercel Environment Information
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Debug Vercel Environment
        run: |
          echo "=== .vercel files ==="
          find .vercel -maxdepth 2 -type f -print

          echo ""
          echo "=== Vercel environment variable names ==="

          if [ -f .vercel/.env.production.local ]; then
            grep '^VITE_' .vercel/.env.production.local \
              | sed 's/=.*/=<REDACTED>/'
          else
            echo ".vercel/.env.production.local not found"
          fi

          echo ""
          echo "=== Repository env files ==="
          find . -maxdepth 2 \
            \( -name ".env" \
            -o -name ".env.local" \
            -o -name ".env.production" \
            -o -name ".env.production.local" \
            -o -name ".env.development" \
            -o -name ".env.development.local" \) \
            -not -path "./node_modules/*" \
            -print

      - name: Build Project Artifacts
        run: |
          vercel build \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"